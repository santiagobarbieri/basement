[package]
name = "basement"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
png = "0.18"

[features]
custom-protocol = ["tauri/custom-protocol"]
